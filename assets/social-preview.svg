<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <radialGradient id="ogGlow1" cx="200" cy="150" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ogGlow2" cx="1080" cy="320" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.22" />
      <circle cx="0" cy="0" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#ogBg)" />
  <rect width="1280" height="640" fill="url(#ogGrid)" />
  <rect width="1280" height="640" fill="url(#ogGlow1)" />
  <rect width="1280" height="640" fill="url(#ogGlow2)" />

  <!-- Outer Blueprint Border -->
  <rect x="24" y="24" width="1232" height="592" rx="16" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 8" stroke-opacity="0.4" fill="none" />

  <!-- Header Badge -->
  <g transform="translate(80, 80)">
    <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">OPEN SOURCE ARCHITECTURAL FIELD GUIDE</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 160)">
    <text x="0" y="50" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5">Pattern<tspan fill="url(#cyanPurple)">Craft</tspan></text>
    <text x="0" y="105" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600">The Architectural Blueprint to Software Design Patterns</text>
    
    <text x="0" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Master all 23 Gang of Four (GoF) patterns with visual schematics, real-world analogies,</text>
    <text x="0" y="178" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">SOLID principles alignment, production trade-offs, and zero academic fluff.</text>
  </g>

  <!-- Key Value Pills -->
  <g transform="translate(80, 400)">
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
      <text x="18" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🏗️ 23 GoF Patterns</text>
    </g>
    <g transform="translate(196, 0)">
      <rect width="186" height="42" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="18" y="26" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📐 Visual Blueprints</text>
    </g>
    <g transform="translate(398, 0)">
      <rect width="190" height="42" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2" />
      <text x="18" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🛡️ SOLID Architecture</text>
    </g>
    <g transform="translate(604, 0)">
      <rect width="168" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="18" y="26" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ Production Code</text>
    </g>
  </g>

  <!-- Author Callout Bottom Bar -->
  <g transform="translate(80, 500)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">CREATED &amp; MAINTAINED BY</text>
    <text x="195" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Rahul Chaube</text>
    <text x="310" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">•</text>
    <text x="330" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">rahulchaube1.com</text>
    <text x="475" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">•</text>
    <text x="495" y="38" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">github.com/Rahulchaube1/PatternCraft</text>
  </g>

  <!-- Right Visual Feature (UML Diagram Preview Card) -->
  <g transform="translate(860, 140)" filter="url(#cardShadow)">
    <rect width="340" height="310" rx="14" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <rect width="340" height="38" rx="14" fill="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="75" y="24" fill="#94a3b8" font-family="monospace" font-size="11">ArchitectureBlueprint.puml</text>

    <!-- Mini schematic elements -->
    <g transform="translate(25, 60)">
      <rect width="130" height="60" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="10" y="22" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="700">&lt;&lt;interface&gt;&gt;</text>
      <text x="10" y="38" fill="#ffffff" font-family="monospace" font-size="11">Strategy</text>
      <text x="10" y="52" fill="#38bdf8" font-family="monospace" font-size="9">+execute()</text>
    </g>

    <g transform="translate(185, 60)">
      <rect width="130" height="60" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="10" y="22" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="700">&lt;&lt;context&gt;&gt;</text>
      <text x="10" y="38" fill="#ffffff" font-family="monospace" font-size="11">Context</text>
      <text x="10" y="52" fill="#34d399" font-family="monospace" font-size="9">+setStrategy()</text>
    </g>

    <path d="M 155 90 L 185 90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <polygon points="185,90 178,86 178,94" fill="#38bdf8" />

    <g transform="translate(25, 145)">
      <rect width="290" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700">// SOLID Principles Engine</text>
      <text x="12" y="42" fill="#94a3b8" font-family="monospace" font-size="10">DIP: Depend on abstractions</text>
      <text x="12" y="56" fill="#94a3b8" font-family="monospace" font-size="10">OCP: Open for extension, closed for mod</text>
    </g>

    <g transform="translate(25, 230)">
      <rect width="290" height="50" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">★ 23 Patterns + Flowcharts</text>
      <text x="14" y="40" fill="#94a3b8" font-family="monospace" font-size="10">Zero-Fluff • Production-Grade • Free</text>
    </g>
  </g>
</svg>