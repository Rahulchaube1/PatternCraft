    <g transform="translate(18, 108)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Adapter &amp; Bridge</text>
      <text x="258" y="17" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="end">Interface / Hierarchy</text>
    </g>
    <g transform="translate(18, 140)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Composite</text>
      <text x="258" y="17" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="end">Tree Hierarchies</text>
    </g>
    <g transform="translate(18, 172)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Decorator</text>
      <text x="258" y="17" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="end">Dynamic Extension</text>
    </g>
    <g transform="translate(18, 204)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Facade</text>
      <text x="258" y="17" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="end">Simplified Interface</text>
    </g>
    <g transform="translate(18, 236)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Flyweight</text>
      <text x="258" y="17" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="end">Memory Optimization</text>
    </g>
    <g transform="translate(18, 268)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Proxy</text>
      <text x="258" y="17" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="end">Surrogate &amp; Access</text>
    </g>
  </g>

  <!-- Pillar 3: Behavioral (x=740, y=130, w=310, h=340) -->
  <g transform="translate(740, 130)" filter="url(#taxShadow)">
    <rect width="310" height="340" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <rect width="310" height="42" rx="10" fill="#047857" fill-opacity="0.25" />
    <line x1="0" y1="42" x2="310" y2="42" stroke="#059669" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="24" cy="21" r="5" fill="#34d399" />
    <text x="38" y="26" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Behavioral Patterns</text>

    <!-- Description -->
    <text x="20" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Communication protocols, algorithms,</text>
    <text x="20" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">and state distribution among components.</text>

