    <g transform="translate(18, 108)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Chain of Resp. &amp; Command</text>
      <text x="258" y="17" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">Execution</text>
    </g>
    <g transform="translate(18, 140)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Iterator &amp; Mediator</text>
      <text x="258" y="17" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">Traversal &amp; Hub</text>
    </g>
    <g transform="translate(18, 172)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Observer &amp; Memento</text>
      <text x="258" y="17" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">Pub/Sub &amp; Undo</text>
    </g>
    <g transform="translate(18, 204)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Strategy</text>
      <text x="258" y="17" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">Interchangeable Algo</text>
    </g>
    <g transform="translate(18, 236)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">State</text>
      <text x="258" y="17" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">State-Driven Behavior</text>
    </g>
    <g transform="translate(18, 268)">
      <rect width="274" height="26" rx="5" fill="#1e293b" />
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11.5" font-weight="600">Template Method &amp; Visitor</text>
      <text x="258" y="17" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">Algorithm Skeleton</text>
    </g>
  </g>
</svg>