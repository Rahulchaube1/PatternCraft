  <g transform="translate(395, 130)" filter="url(#taxShadow)">
    <rect width="310" height="340" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <rect width="310" height="42" rx="10" fill="#4f46e5" fill-opacity="0.25" />
    <line x1="0" y1="42" x2="310" y2="42" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="24" cy="21" r="5" fill="#818cf8" />
    <text x="38" y="26" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Structural Patterns</text>

    <!-- Description -->
    <text x="20" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Composition of classes and objects into</text>
    <text x="20" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">larger, flexible and decoupled structures.</text>

