<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTopLeft" cx="150" cy="80" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAccent" cx="1100" cy="190" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Line Gradients -->
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2" />
      <circle cx="0" cy="0" r="1.5" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <!-- Box Drop Shadows -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="380" fill="url(#bgGrad)" />
  <rect width="1280" height="380" fill="url(#gridPattern)" />
  <rect width="1280" height="380" fill="url(#glowTopLeft)" />
  <rect width="1280" height="380" fill="url(#glowAccent)" />

  <!-- Subtle Blueprint Architectural Grid Overlay -->
  <g opacity="0.15">
    <line x1="80" y1="40" x2="1200" y2="40" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="80" y1="340" x2="1200" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="80" y1="40" x2="80" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="1200" y1="40" x2="1200" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Left Side: Branding and Typography -->
  <!-- Top Version Badge -->
  <g transform="translate(90, 56)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4.5" fill="#10b981" />
    <text x="26" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ARCHITECTURAL BLUEPRINTS</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Pattern<tspan fill="url(#accentCyan)">Craft</tspan></text>

  <!-- Subtitle -->
  <text x="90" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">The Modern Software Architecture &amp; Design Patterns Guide</text>

  <!-- Description -->
  <text x="90" y="206" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Master 23 GoF Design Patterns with clean diagrams, real-world analogies, SOLID alignment,</text>
  <text x="90" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">production code implementations, architectural trade-offs, and zero cognitive fluff.</text>

  <!-- Feature Pills -->
  <g transform="translate(90, 268)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="138" height="34" rx="8" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🏗️ 23 GoF Patterns</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(150, 0)">
      <rect width="154" height="34" rx="8" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📐 Visual Blueprints</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(316, 0)">
      <rect width="156" height="34" rx="8" fill="url(#pillGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ SOLID Principles</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(484, 0)">
      <rect width="168" height="34" rx="8" fill="url(#pillGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Production Trade-offs</text>
    </g>
  </g>

  <!-- Right Side: Clean Architectural Schematic Cards (Non-AI, Authentic UML/Engineering Vibe) -->
  <g transform="translate(770, 48)" filter="url(#shadow)">
    <!-- Diagram Card 1: Creational (Factory / Product) -->
    <g transform="translate(140, 20)">
      <rect width="240" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <rect width="240" height="28" rx="10" fill="#1e3a8a" fill-opacity="0.4" />
      <text x="16" y="19" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="700">&lt;&lt;interface&gt;&gt; Product</text>
      <circle cx="222" cy="14" r="3.5" fill="#38bdf8" />
      <line x1="0" y1="28" x2="240" y2="28" stroke="#334155" stroke-width="1" />
      <text x="16" y="50" fill="#cbd5e1" font-family="monospace" font-size="11">+ execute(): Result</text>
      <text x="16" y="70" fill="#94a3b8" font-family="monospace" font-size="11">+ configure(spec): void</text>
      <text x="16" y="94" fill="#64748b" font-family="monospace" font-size="10">// decoupled implementation</text>
    </g>

    <!-- Diagram Card 2: Client / Invoker -->
    <g transform="translate(0, 100)">
      <rect width="200" height="96" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <rect width="200" height="28" rx="10" fill="#312e81" fill-opacity="0.4" />
      <text x="14" y="19" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700">Client / Invoker</text>
      <circle cx="184" cy="14" r="3.5" fill="#818cf8" />
      <line x1="0" y1="28" x2="200" y2="28" stroke="#334155" stroke-width="1" />
      <text x="14" y="50" fill="#cbd5e1" font-family="monospace" font-size="11">- strategy: Strategy</text>
      <text x="14" y="72" fill="#38bdf8" font-family="monospace" font-size="11">+ run(): void</text>
    </g>

    <!-- Diagram Card 3: Structural / Decorator -->
    <g transform="translate(180, 170)">
      <rect width="230" height="106" rx="10" fill="#090d16" stroke="#10b981" stroke-width="1.5" />
      <rect width="230" height="28" rx="10" fill="#064e3b" fill-opacity="0.4" />
      <text x="14" y="19" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">ConcreteComponent</text>
      <circle cx="212" cy="14" r="3.5" fill="#34d399" />
      <line x1="0" y1="28" x2="230" y2="28" stroke="#334155" stroke-width="1" />
      <text x="14" y="50" fill="#cbd5e1" font-family="monospace" font-size="11">- wrapped: Component</text>
      <text x="14" y="70" fill="#6ee7b7" font-family="monospace" font-size="11">+ execute(): Result</text>
      <text x="14" y="92" fill="#64748b" font-family="monospace" font-size="10">↳ wraps &amp; extends dynamically</text>
    </g>

    <!-- Connectors / Architectural Vectors -->
    <path d="M 200 148 L 260 148 L 260 80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    <polygon points="260,74 256,82 264,82" fill="#38bdf8" />

    <path d="M 200 160 L 230 160 L 230 220 L 260 220" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
    <polygon points="266,220 258,216 258,224" fill="#818cf8" />
  </g>
</svg>